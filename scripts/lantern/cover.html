<!-- @dsCard height=288 -->
<style>
  body { margin: 0; }
  /* Lantern's own colors (Sharon, Oct 15): night iron, copper, amber flame, peach glow. They belong to
     Lantern's mark and cover only; the themes keep their own. */
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: #2a1a12; }
  .mark { position: absolute; left: -20px; top: 8px; }
  .text { position: absolute; left: 216px; bottom: 69px; max-width: 640px; }
  .name { margin: 0; font: 400 112px/0.92 Georgia, 'Iowan Old Style', serif; color: #f7c9a6; }
  /* Optical kerning (Sharon, Oct 15): the open sides of L, e and r leave extra air, so those pairs close up (L sits 2px away from a, by eye);
     n and t close by 1.5px; r and n open a pixel. */
  .k-l { margin-right: 2px; }
  .k-n { margin-right: -1.5px; }
  .k-t { margin-right: -2px; }
  .k-e { margin-right: -2px; }
  .k-r { margin-right: 1px; }
  .tagline { margin: 12px 0 0 4px; font: 16px/1.5 system-ui, sans-serif; color: #d8b49a; }
</style>
<div class="cover">
  <!--
    blocks: one night-iron ground (#2a1a12), the lantern's copper (#8a4f27, #b5672f) and its amber orb (#f6b25a)
    arrangement: golden ratio (Sharon, Oct 15). The space right of the name is phi times the lantern's space on its left (name at x = 216, about 395 wide, leaving 349); the lantern is centered in that left space (its middle at x = 108). Tagline 16px = 112 / phi^4, 12px (space-3) under the name, its baseline level with the bottom of the lantern's base.
    pattern: a literal motif, the lantern and its one orb, "a page has one light, an orb" (README)
    scales: the mark at 1.6x its 160 x 175 drawing; no rays, only the orb's halo
  -->
  <svg class="mark" width="256" height="280" viewBox="0 0 160 175" role="img" aria-label="Lantern">
  <defs>
    <radialGradient id="halo" cx="80" cy="84" r="58" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f6b25a" stop-opacity="0.22"/><stop offset="0.45" stop-color="#f7c9a6" stop-opacity="0.08"/><stop offset="1" stop-color="#f7c9a6" stop-opacity="0"/></radialGradient>
    <radialGradient id="inner" cx="80" cy="84" r="34" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff1d0" stop-opacity="0.75"/><stop offset="0.25" stop-color="#ffd38a" stop-opacity="0.4"/><stop offset="0.7" stop-color="#e8a060" stop-opacity="0.12"/><stop offset="1" stop-color="#c8743b" stop-opacity="0.05"/></radialGradient>
    <radialGradient id="core" cx="80" cy="84" r="11" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fffaf0"/><stop offset="0.35" stop-color="#ffe3b0"/><stop offset="0.75" stop-color="#f6b25a"/><stop offset="1" stop-color="#f6b25a" stop-opacity="0"/></radialGradient>
    <radialGradient id="pool" cx="80" cy="150" r="42" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 130) scale(1 0.14)"><stop offset="0.3" stop-color="#f7c9a6" stop-opacity="0.16"/><stop offset="1" stop-color="#f7c9a6" stop-opacity="0"/></radialGradient>
    <clipPath id="glass"><rect x="54" y="50" width="52" height="66" rx="18"/></clipPath>
  </defs>
  <circle cx="80" cy="84" r="58" fill="url(#halo)"/>
  <ellipse cx="80" cy="150" rx="44" ry="7" fill="url(#pool)"/>
  <ellipse cx="80" cy="150" rx="20" ry="3.5" fill="#120a06" opacity="0.65"/>
  <path d="M58 38 A22 22 0 0 1 102 38" fill="none" stroke="#8a4f27" stroke-width="5" stroke-linecap="round"/>
  <path d="M59.91 32.62 A20.8 20.8 0 0 1 74.62 17.91" fill="none" stroke="#f7c9a6" stroke-width="1.1" stroke-linecap="round" opacity="0.6"/>
  <rect x="56" y="38" width="48" height="12" rx="4" fill="#8a4f27"/>
  <path d="M60 49.2 H100" stroke="#f7c9a6" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  <g clip-path="url(#glass)"><rect x="54" y="50" width="52" height="66" fill="#fff6e8" opacity="0.04"/><circle cx="80" cy="84" r="34" fill="url(#inner)"/></g>
  <rect x="54" y="50" width="52" height="66" rx="18" fill="none" stroke="#b5672f" stroke-width="3.5"/>
  <path d="M58.5 68 A13.5 13.5 0 0 1 72 54.5" fill="none" stroke="#ffe9d6" stroke-width="1" stroke-linecap="round" opacity="0.28"/>
  <path d="M101.5 98 A13.5 13.5 0 0 1 88 111.5" fill="none" stroke="#ffe9d6" stroke-width="1" stroke-linecap="round" opacity="0.28"/>
  <circle cx="80" cy="84" r="11" fill="url(#core)"/>
  <rect x="58" y="116" width="44" height="12" rx="4" fill="#8a4f27"/>
  <path d="M62 116.8 H98" stroke="#f7c9a6" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
</svg>
  <div class="text">
    <h1 class="name"><span class="k-l">L</span>a<span class="k-n">n</span><span class="k-t">t</span><span class="k-e">e</span><span class="k-r">r</span>n</h1>
    <p class="tagline">The light you leave behind reaches further than you know.</p>
  </div>
</div>
