<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 175" role="img" aria-label="Lantern">
  <!-- Lantern's mark (Sharon, Oct 15): a copper camp lantern with one orb inside. Light rules: the glow is
       a full halo from the orb; metal sits darker in front of it; edges facing the orb catch light; the base
       casts a shadow. Every highlight sits on its shape's own curve: glass highlights are warm white (the flame's
       reflection), metal highlights are the name's peach, which ties the lantern to the word. Made for a dark ground (night iron). -->
  <defs>
    <radialGradient id="halo" cx="80" cy="84" r="58" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f6b25a" stop-opacity="0.22"/><stop offset="0.45" stop-color="#f7c9a6" stop-opacity="0.08"/><stop offset="1" stop-color="#f7c9a6" stop-opacity="0"/></radialGradient>
    <radialGradient id="inner" cx="80" cy="84" r="34" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff1d0" stop-opacity="0.75"/><stop offset="0.25" stop-color="#ffd38a" stop-opacity="0.4"/><stop offset="0.7" stop-color="#e8a060" stop-opacity="0.12"/><stop offset="1" stop-color="#c8743b" stop-opacity="0.05"/></radialGradient>
    <radialGradient id="core" cx="80" cy="84" r="11" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fffaf0"/><stop offset="0.35" stop-color="#ffe3b0"/><stop offset="0.75" stop-color="#f6b25a"/><stop offset="1" stop-color="#f6b25a" stop-opacity="0"/></radialGradient>
    <radialGradient id="pool" cx="80" cy="150" r="42" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 130) scale(1 0.14)"><stop offset="0.3" stop-color="#f7c9a6" stop-opacity="0.16"/><stop offset="1" stop-color="#f7c9a6" stop-opacity="0"/></radialGradient>
    <clipPath id="glass"><rect x="54" y="50" width="52" height="66" rx="18"/></clipPath>
  </defs>
  <circle data-lm="glow" cx="80" cy="84" r="58" fill="url(#halo)"/>
  <ellipse data-lm="floor" cx="80" cy="150" rx="44" ry="7" fill="url(#pool)"/>
  <ellipse data-lm="floor" cx="80" cy="150" rx="20" ry="3.5" fill="#120a06" opacity="0.65"/>
  <path data-lm="copper" d="M62.4 38 A17.6 17.6 0 0 1 97.6 38" fill="none" stroke="#8a4f27" stroke-width="5" stroke-linecap="round"/>
  <path data-lm="accent" d="M63.93 33.7 A16.64 16.64 0 0 1 75.7 21.93" fill="none" stroke="#f7c9a6" stroke-width="1.1" stroke-linecap="round" opacity="0.6"/>
  <rect data-lm="copper" x="56" y="38" width="48" height="12" rx="4" fill="#8a4f27"/>
  <path data-lm="lip" d="M60 49.2 H100" stroke="#f7c9a6" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  <g data-lm="inside" clip-path="url(#glass)"><rect x="54" y="50" width="52" height="66" fill="#fff6e8" opacity="0.04"/><circle cx="80" cy="84" r="34" fill="url(#inner)"/></g>
  <rect data-lm="copper" x="54" y="50" width="52" height="66" rx="18" fill="none" stroke="#8a4f27" stroke-width="3.5"/>
  <path data-lm="accent" d="M58.5 68 A13.5 13.5 0 0 1 72 54.5" fill="none" stroke="#f7c9a6" stroke-width="1" stroke-linecap="round" opacity="0.28"/>
  <path data-lm="accent" d="M101.5 98 A13.5 13.5 0 0 1 88 111.5" fill="none" stroke="#f7c9a6" stroke-width="1" stroke-linecap="round" opacity="0.28"/>
  <circle data-lm="orb" cx="80" cy="84" r="11" fill="url(#core)"/>
  <rect data-lm="copper" x="58" y="116" width="44" height="12" rx="4" fill="#8a4f27"/>
  <path data-lm="lip" d="M62 116.8 H98" stroke="#f7c9a6" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
</svg>
