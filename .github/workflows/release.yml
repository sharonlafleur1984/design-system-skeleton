# Releases: when a version tag like v0.4.0 is pushed, this builds the package and attaches it to a
# GitHub Release as one file. Apps install that file, which has only what they need (the built
# components, the theme CSS and the fonts), instead of the whole repo and its build tools.
# Release notes come from CHANGELOG.md.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # npm ci runs "prepare", which builds the tokens and the package.
      - run: npm ci
      - run: npm test
      - name: Pack the package
        id: pack
        run: echo "file=$(npm pack --silent)" >> "$GITHUB_OUTPUT"
      - name: Create the release with the package attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FILE: ${{ steps.pack.outputs.file }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" "$FILE" --title "$TAG" \
            --notes "See CHANGELOG.md for what changed. Install with: npm install https://github.com/$REPO/releases/download/$TAG/$FILE"
