# Runs on every pull request: builds the tokens, checks types, runs the
# contract and contrast tests, checks the code for mistakes (ESLint), and makes sure Storybook still builds.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Lets the update-screenshots job rerun this check on its own commit.
  workflow_dispatch:
# The check only reads the code.
permissions:
  contents: read
# A new push replaces a run that's still going on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build-storybook
