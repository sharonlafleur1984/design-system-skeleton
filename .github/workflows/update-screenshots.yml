# Approves new screenshots. Add the "update-screenshots" label to a pull request and
# this takes fresh screenshots of every story, commits them to the pull request's
# branch, reruns the checks on that commit, and removes the label. Review the new images in the pull request's
# "Files changed" tab before merging. It also posts a short summary comment on the pull request
# (scripts/screenshot-summary.mjs): what changed and by how much, so a review starts there.
name: Update screenshots
on:
  pull_request:
    types: [labeled]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  update:
    if: github.event.label.name == 'update-screenshots'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - run: npx playwright test --update-snapshots
        env:
          HOME: /root
      - name: Commit the new screenshots
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          git diff --cached --quiet && echo "No screenshot changes." && exit 0
          git commit -m "Approve new screenshots"
          git push
      - name: Post the screenshot summary
        run: node scripts/screenshot-summary.mjs "origin/${{ github.event.pull_request.base.ref }}" HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      # A commit pushed by this job doesn't start other checks on its own (GitHub's rule),
      # so start them here. Otherwise required checks would wait forever.
      - name: Rerun the checks on the new commit
        run: |
          for wf in ci.yml visual-tests.yml; do
            curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$wf/dispatches" \
              -d '{"ref":"${{ github.event.pull_request.head.ref }}"}'
          done
      - name: Remove the label
        if: always()
        run: |
          curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/update-screenshots"
