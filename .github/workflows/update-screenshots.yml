# Approves new screenshots. Add the "update-screenshots" label to a pull request and
# this takes fresh screenshots of every story, commits them to the pull request's
# branch, and removes the label. Review the new images in the pull request's
# "Files changed" tab before merging.
name: Update screenshots
on:
  pull_request:
    types: [labeled]
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    if: github.event.label.name == 'update-screenshots'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - run: npx playwright test --update-snapshots
        env:
          HOME: /root
      - name: Commit the new screenshots
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          git diff --cached --quiet && echo "No screenshot changes." && exit 0
          git commit -m "Approve new screenshots"
          git push
      - name: Remove the label
        if: always()
        run: |
          curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/update-screenshots"
