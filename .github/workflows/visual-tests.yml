# Visual tests: screenshots every Storybook story at phone, tablet and desktop and
# compares them with the approved screenshots in tests/visual/__screenshots__.
# If something looks different, this check fails and comments on the pull request with
# a link to the "visual-report" file: before, after and the difference.
# Meant the change? Add the "update-screenshots" label to the pull request to approve it.
name: Visual tests
on:
  pull_request:
  push:
    branches: [main]
  # Lets the update-screenshots job rerun this check on its own commit.
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  visual:
    runs-on: ubuntu-latest
    # The same browser and fonts every time, so screenshots only change when the design does.
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - run: npx playwright test
        env:
          HOME: /root
      - if: failure()
        id: report
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: playwright-report/
          retention-days: 14
      # Puts a link to the images on the pull request, so there's nothing to hunt for.
      # Updates its own comment instead of adding a new one each run.
      - if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          OUTCOME: ${{ job.status }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- visual-check -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body.includes(marker));
            const failed = process.env.OUTCOME !== 'success';
            if (!failed && !mine) return;
            const body = failed
              ? [
                  marker,
                  '**Visual check: something looks different.**',
                  '',
                  `[Download the images](${process.env.REPORT_URL || process.env.RUN_URL}), then open \`index.html\` inside to see before, after and the difference.`,
                  '',
                  'Meant the change? Add the `update-screenshots` label to approve it.',
                ].join('\n')
              : `${marker}\n**Visual check: everything matches now.**`;
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
